name: CI
on:
  push:
  pull_request:
jobs:
  validate-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate docker-compose syntax
        run: docker compose config -q
      - name: Build images
        run: docker compose build
      - name: Start environment
        run: docker compose up -d
      - name: Wait for services to be healthy
        run: |
          echo "Waiting for all services to be healthy..."
          for i in $(seq 1 60); do
            if docker compose exec -T app-01 python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)" 2>/dev/null && \
               docker compose exec -T app-02 python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)" 2>/dev/null && \
               curl -sf http://127.0.0.1:8080/health > /dev/null 2>&1; then
              echo "All services are healthy!"
              break
            fi
            echo "Waiting for services... ($i/60)"
            sleep 2
          done
      - name: Show container status for debugging
        run: docker compose ps -a
      - name: Show nginx logs for debugging
        run: docker compose logs nginx --tail=50
      - name: Run validation script
        run: |
          chmod +x validate.py || true
          python3 validate.py
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down
