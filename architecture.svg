<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><style>text{font-family:Arial;fill:#172033}.t{font-size:22px;font-weight:bold}.s{font-size:16px}.box{stroke:#1b4d89;stroke-width:3;rx:16}.arrow{stroke:#263c59;stroke-width:4;marker-end:url(#a)}.health{stroke:#299c63;stroke-width:3;stroke-dasharray:9 7;fill:none}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#263c59"/></marker></defs><rect width="1400" height="800" fill="#f6f9fc"/><text x="50" y="55" class="t">BARQ final video architecture — public port 8090</text><rect x="45" y="120" width="180" height="100" class="box" fill="#d8edff"/><text x="95" y="165" class="t">Client</text><text x="72" y="195" class="s">HTTP :8090</text><rect x="330" y="110" width="220" height="120" class="box" fill="#d8edff"/><text x="400" y="160" class="t">NGINX</text><text x="360" y="190" class="s">Only published service</text><rect x="650" y="65" width="690" height="290" class="box" fill="#eef8f1"/><text x="675" y="100" class="t">frontend network</text><rect x="700" y="140" width="160" height="100" class="box" fill="#fff2c7"/><text x="728" y="185" class="t">app-01</text><text x="715" y="215" class="s">Flask :8080</text><rect x="930" y="140" width="160" height="100" class="box" fill="#fff2c7"/><text x="958" y="185" class="t">app-02</text><text x="945" y="215" class="s">Flask :8080</text><rect x="1160" y="140" width="160" height="100" class="box" fill="#fff2c7"/><text x="1188" y="185" class="t">app-03</text><text x="1175" y="215" class="s">Video addition</text><rect x="650" y="430" width="690" height="260" class="box" fill="#f3edfc"/><text x="675" y="465" class="t">backend network (internal)</text><rect x="790" y="535" width="190" height="90" class="box" fill="#f9dce0"/><text x="825" y="575" class="t">PostgreSQL</text><text x="810" y="605" class="s">named volume</text><rect x="1080" y="535" width="160" height="90" class="box" fill="#f9dce0"/><text x="1120" y="575" class="t">Redis</text><text x="1102" y="605" class="s">AOF volume</text><line x1="225" y1="170" x2="330" y2="170" class="arrow"/><line x1="550" y1="170" x2="700" y2="170" class="arrow"/><line x1="550" y1="170" x2="930" y2="170" class="arrow"/><line x1="550" y1="170" x2="1160" y2="170" class="arrow"/><path d="M780 240 L780 535 M1010 240 L885 535 M1240 240 L885 535 M780 240 L1160 535 M1010 240 L1160 535 M1240 240 L1160 535" class="health"/><text x="60" y="290" class="s">Solid arrows: request flow. Dashed green: application readiness checks to PostgreSQL and Redis.</text><text x="60" y="735" class="s">Remaining single points of failure: one NGINX, one PostgreSQL and one Redis instance. Production: replicas, managed database/cache and monitoring.</text></svg>
